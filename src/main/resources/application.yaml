spring:
  application:
    name: modular-sharding-api

  profiles:
    default: local

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
        default_batch_fetch_size: 100

  flyway:
    locations: classpath:db/migration/application

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}
        environment: ${APP_ENV:local}
        revision: ${APP_REVISION:local}
      stacktrace:
        max-length: 8192
